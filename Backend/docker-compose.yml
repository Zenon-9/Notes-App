services:
  mongodb:
    image: mongo:8
    container_name: mongodb

    ports:
      - "27017:27017"
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: abc123
      MONGO_INITDB_DATABASE: mydb

    volumes:
      - ./mongo_data:/data/db

volumes:
  mongo_data: